<main><section class="entry-home" aria-labelledby="home-title"><div class="shell halo-hero">

    </div>

      <stop offset=".28" stop-color="#F9C16B"/>
      <stop offset=".62" stop-color="#DE8150"/>
      <stop offset="1" stop-color="#B94F35"/>
    </linearGradient>
